plugins {
    id 'com.android.application'
}

// Release signing key, configured outside the repo: set
// extraquiet.keystoreProperties=/path/to/keystore.properties in ~/.gradle/gradle.properties.
// That file holds storeFile, storePassword, keyAlias and keyPassword.
def keystoreProps = new Properties()
def keystorePropsPath = findProperty('extraquiet.keystoreProperties')
if (keystorePropsPath != null) {
    file(keystorePropsPath).withInputStream { keystoreProps.load(it) }
}

android {
    namespace = 'net.kolya.android.extraquiet'
    compileSdk = 36

    defaultConfig {
        applicationId = 'net.kolya.android.extraquiet'
        minSdk = 29
        targetSdk = 36
        versionCode = 2
        versionName = '1.1'
    }

    signingConfigs {
        if (!keystoreProps.isEmpty()) {
            upload {
                storeFile = file(keystoreProps['storeFile'])
                storePassword = keystoreProps['storePassword']
                keyAlias = keystoreProps['keyAlias']
                keyPassword = keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            // Without an upload key, fall back to the debug key so release builds still install.
            signingConfig = keystoreProps.isEmpty() ? signingConfigs.debug : signingConfigs.upload
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
